name: Dati fotovoltaico EPEVER

on:
  schedule:
    - cron: "7 11,19 * * *"     # 13:07 e 21:07 ora legale (12:07 e 20:07 ora solare)
  workflow_dispatch: {}          # avvio manuale dalla scheda Actions

permissions:
  contents: write                # serve solo per salvare i JSON nel repository

concurrency:
  group: epever
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests==2.32.3 cryptography==43.0.3

      # Il token di Solar Guardian resta in cache tra un'esecuzione e l'altra:
      # così lo script non rifà il login ogni ora (meno rischio di captcha).
      - name: Recupera token
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: epever-token-${{ github.run_id }}
          restore-keys: epever-token-

      - name: Leggi Solar Guardian
        env:
          EPEVER_ACCOUNT: ${{ secrets.EPEVER_ACCOUNT }}
          EPEVER_PASSWORD: ${{ secrets.EPEVER_PASSWORD }}
          EPEVER_DEVICE_DATA: "1"
        run: python scripts/epever_solar_guardian.py

      # Contatore di muoni (Glacier Muon Telescope): se l'API non risponde, i dati EPEVER si pubblicano comunque
      - name: Leggi contatore di muoni
        continue-on-error: true
        run: python scripts/muon.py

      # Webcam Tapo: un fotogramma al giorno, solo con la lettura delle 13 (o con l'avvio manuale).
      # Le immagini stanno nel branch "webcam", sovrascritto ogni volta: non appesantiscono la storia del repository.
      - name: Recupera le webcam precedenti
        continue-on-error: true
        run: |
          mkdir -p webcam
          git fetch -q origin webcam && git archive FETCH_HEAD | tar -x -C webcam || echo "nessuna immagine precedente"

      - name: Fotogrammi webcam (una volta al giorno)
        continue-on-error: true
        env:
          TAPO_ACCOUNT: ${{ secrets.TAPO_ACCOUNT }}
          TAPO_PASSWORD: ${{ secrets.TAPO_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%H)" -lt 16 ]; then
            sudo apt-get install -y -qq ffmpeg > /dev/null
            pip install -q ontapo pillow
            python scripts/tapo_webcam.py && echo "WEBCAM_DONE=1" >> "$GITHUB_ENV"
          else
            echo "Le webcam si aggiornano solo con la lettura delle 13."
          fi

      - name: Pubblica le webcam
        if: env.WEBCAM_DONE == '1'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd webcam
          git init -q -b webcam
          git config user.name  "sasso-data-bot"
          git config user.email "sasso-data-bot@users.noreply.github.com"
          git add -A
          git commit -qm "webcam $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" webcam

      - name: Salva token
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: epever-token-${{ github.run_id }}

      - name: Pubblica i JSON
        run: |
          git config user.name  "sasso-data-bot"
          git config user.email "sasso-data-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nessuna novità"
            exit 0
          fi
          git commit -m "dati EPEVER $(date -u +%Y-%m-%dT%H:%MZ)"
          # se nel frattempo il repository è cambiato, ci si allinea e si riprova
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
